# Builds the Rust MCP server (rust/) on every change, and publishes prebuilt
# binaries as a GitHub Release when a rust-v* tag is pushed, so nobody needs
# a Rust toolchain to run it.
name: Rust server

on:
  push:
    branches: [rust-hub]
    paths: ["rust/**", ".github/workflows/rust.yml"]
    tags: ["rust-v*"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Hosted macOS arm64 runners are often short of capacity, and a queued job
    # can be cancelled without ever starting, which fails the whole run. So
    # ordinary pushes test Windows and Linux; release tags also try macOS, and
    # that job may fail without failing the run or blocking the release.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/rust-v') && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest","ubuntu-latest"]') }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: cargo build --locked --release
      - name: Package
        run: |
          case "$RUNNER_OS" in
            Windows) exe=ue-mcp-rs.exe; archive=ue-mcp-rs-windows-x64.zip ;;
            macOS)   exe=ue-mcp-rs;     archive=ue-mcp-rs-macos-arm64.tar.gz ;;
            *)       exe=ue-mcp-rs;     archive=ue-mcp-rs-linux-x64.tar.gz ;;
          esac
          mkdir dist
          cp "target/release/$exe" README.md ../LICENSE dist/
          cd dist
          if [[ "$archive" == *.zip ]]; then 7z a "../$archive" ./*; else tar czf "../$archive" ./*; fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: rust/${{ env.ARCHIVE }}

  release:
    # !cancelled() lets the release go out when only the optional macOS build is missing.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/rust-v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Require the Windows and Linux builds
        run: ls -l artifacts && test -f artifacts/ue-mcp-rs-windows-x64.zip && test -f artifacts/ue-mcp-rs-linux-x64.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ue-mcp-rs ${GITHUB_REF_NAME#rust-v}" \
            --notes "Prebuilt ue-mcp-rs MCP server; no Rust toolchain needed. Windows: run rust/install.ps1, or unzip ue-mcp-rs-windows-x64.zip and register the exe with claude mcp add. See rust/README.md."
